<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1060" width="100%" height="100%" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#2563EB" />
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#64748B" />
    </marker>
  </defs>

  <!-- ==================== 1. MOBIL MEVI ==================== -->
  <g id="box-mobil-mevi">
    <!-- Container -->
    <rect x="120" y="40" width="460" height="190" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" />
    <text x="135" y="60" font-size="12" font-weight="700" fill="#1E3A8A">MOBIL MEVI</text>

    <!-- Node: Sensor -->
    <rect x="135" y="70" width="430" height="52" rx="26" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.5" />
    <text x="350" y="91" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">Sensor</text>
    <text x="350" y="108" text-anchor="middle" font-size="11" fill="#1E40AF">LiDAR 3D  ·  Kamera ZED 2i (RGB + Depth)  ·  IMU  ·  GPS  ·  Odometri</text>

    <!-- Arrow Sensor -> Jetson -->
    <path d="M 350 122 L 350 160" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />
    <rect x="315" y="132" width="70" height="16" fill="#FFFFFF" />
    <text x="350" y="144" text-anchor="middle" font-size="10.5" fill="#2563EB" font-weight="600">topik ROS</text>

    <!-- Node: Jetson -->
    <rect x="165" y="160" width="370" height="48" rx="24" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
    <text x="350" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">Komputer Onboard (Jetson)</text>
    <text x="350" y="196" text-anchor="middle" font-size="11" fill="#475569">Perekaman data ke berkas rosbag</text>
  </g>

  <!-- Arrow Jetson -> Step 1 -->
  <path d="M 350 208 L 350 260 L 350 292" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />
  <rect x="305" y="238" width="90" height="16" fill="#FFFFFF" />
  <text x="350" y="250" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="600">berkas rosbag</text>

  <!-- ==================== 2. PEMROSESAN DATA (Python) ==================== -->
  <g id="box-python">
    <!-- Container -->
    <rect x="90" y="260" width="520" height="470" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" />
    <text x="105" y="280" font-size="12" font-weight="700" fill="#1E3A8A">PEMROSESAN DATA (Python)</text>

    <!-- Step 1 -->
    <rect x="145" y="292" width="410" height="46" rx="23" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="350" y="311" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">1. Ekstraksi &amp; sinkronisasi rosbag</text>
    <text x="350" y="326" text-anchor="middle" font-size="11" fill="#64748B">+ pembentukan waypoint (ego-frame)</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M 350 338 L 350 366" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />

    <!-- Step 2 -->
    <rect x="195" y="366" width="310" height="42" rx="21" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="350" y="392" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">2. Kalibrasi LiDAR–kamera</text>

    <!-- Arrow 2 -> 3 -->
    <path d="M 350 408 L 350 436" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />

    <!-- Step 3 -->
    <rect x="105" y="436" width="490" height="46" rx="23" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
    <text x="350" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">3. Deteksi objek</text>
    <text x="350" y="470" text-anchor="middle" font-size="11" fill="#1D4ED8" font-weight="600">YOLO-seg + sensor fusion (RGB, depth, LiDAR)</text>

    <!-- Arrow 3 -> 4 -->
    <path d="M 350 482 L 350 510" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />

    <!-- Step 4 -->
    <rect x="205" y="510" width="290" height="44" rx="22" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="350" y="528" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">4. Segmentasi LiDAR 3D</text>
    <text x="350" y="543" text-anchor="middle" font-size="11" fill="#64748B">(berbasis geometri)</text>

    <!-- Arrow 4 -> 5 -->
    <path d="M 350 554 L 350 582" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />

    <!-- Step 5 -->
    <rect x="140" y="582" width="420" height="46" rx="23" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="350" y="601" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">5. Payload BEV</text>
    <text x="350" y="616" text-anchor="middle" font-size="11" fill="#64748B">(titik, objek, waypoint) + geometri jalan</text>

    <!-- Arrow 5 -> 6 -->
    <path d="M 350 628 L 350 656" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />

    <!-- Step 6 -->
    <rect x="220" y="656" width="260" height="44" rx="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
    <text x="350" y="674" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">6. Streaming per frame</text>
    <text x="350" y="689" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="600">(roslibpy)</text>
  </g>

  <!-- Arrow Step 6 -> Rosbridge -->
  <path d="M 350 730 L 350 770 L 305 770 L 305 795" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />
  <rect x="270" y="740" width="160" height="26" fill="#FFFFFF" />
  <text x="350" y="752" text-anchor="middle" font-size="10.5" fill="#2563EB" font-weight="600">topik /bev/*, /vehicle/*</text>
  <text x="350" y="763" text-anchor="middle" font-size="10" fill="#2563EB">(JSON)</text>

  <!-- Dashed Curved Arrow: Jetson -> Web Video Server -->
  <path d="M 535 184 C 670 210, 720 540, 540 795" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arr-gray)" />
  <rect x="655" y="490" width="70" height="16" fill="#FFFFFF" />
  <text x="690" y="502" text-anchor="middle" font-size="10.5" fill="#475569" font-weight="600">topik citra</text>

  <!-- ==================== 3. ROS1 NOETIC ENVIRONMENT ==================== -->
  <g id="box-ros">
    <!-- Container -->
    <rect x="180" y="770" width="480" height="85" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" />
    <text x="650" y="788" text-anchor="end" font-size="10.5" font-weight="700" fill="#1E3A8A">ROS1 NOETIC ENVIRONMENT</text>

    <!-- Rosbridge Server -->
    <rect x="195" y="795" width="220" height="46" rx="23" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
    <text x="305" y="814" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Rosbridge Server</text>
    <text x="305" y="829" text-anchor="middle" font-size="10.5" fill="#1D4ED8">(WebSocket, port 9090)</text>

    <!-- Web Video Server (dashed) -->
    <rect x="430" y="795" width="215" height="46" rx="23" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="537" y="814" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Web Video Server</text>
    <text x="537" y="829" text-anchor="middle" font-size="10.5" fill="#475569">(HTTP, port 8080)</text>
  </g>

  <!-- Arrows ROS -> Flutter UI -->
  <!-- Rosbridge -> Flutter (WebSocket) -->
  <path d="M 305 841 L 305 890 L 320 905" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />
  <rect x="290" y="865" width="70" height="16" fill="#FFFFFF" />
  <text x="325" y="877" text-anchor="middle" font-size="10.5" fill="#2563EB" font-weight="600">WebSocket</text>

  <!-- Web Video Server -> Flutter (HTTP video stream) -->
  <path d="M 537 841 L 537 890 L 460 905" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-gray)" />
  <rect x="475" y="865" width="115" height="16" fill="#FFFFFF" />
  <text x="532" y="877" text-anchor="middle" font-size="10.5" fill="#475569" font-weight="600">HTTP video stream</text>

  <!-- ==================== 4. DASHBOARD APP ==================== -->
  <g id="box-dashboard">
    <!-- Container -->
    <rect x="60" y="880" width="620" height="90" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" />
    <text x="75" y="900" font-size="12" font-weight="700" fill="#1E3A8A">DASHBOARD APP</text>

    <!-- Flutter UI -->
    <rect x="75" y="908" width="590" height="46" rx="23" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
    <text x="370" y="927" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">Flutter UI</text>
    <text x="370" y="942" text-anchor="middle" font-size="11" fill="#1E40AF">BEV 3D animasi  ·  BEV point cloud  ·  Peta &amp; navigasi  ·  Grafik</text>
  </g>
</svg>
