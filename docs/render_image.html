<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .wrapper {
      width: 700px;
      background: #FFFFFF;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 970" width="100%" height="100%" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
      <defs>
        <!-- Crisp proportional arrowheads -->
        <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
          <polygon points="0 0.5, 6 3.5, 0 6.5" fill="#2563EB" />
        </marker>
        <marker id="arr-gray" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
          <polygon points="0 0.5, 6 3.5, 0 6.5" fill="#64748B" />
        </marker>
      </defs>

      <!-- ==================== 1. MOBIL MEVI ==================== -->
      <g id="box-mobil-mevi">
        <!-- Container -->
        <rect x="80" y="20" width="480" height="180" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.6" />
        <text x="96" y="42" font-size="12" font-weight="700" fill="#1E3A8A">MOBIL MEVI</text>

        <!-- Sensor Node -->
        <rect x="100" y="52" width="440" height="50" rx="25" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.5" />
        <text x="320" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">Sensor</text>
        <text x="320" y="89" text-anchor="middle" font-size="11" fill="#1E40AF">LiDAR 3D  ·  Kamera ZED 2i (RGB + Depth)  ·  IMU  ·  GPS  ·  Odometri</text>

        <!-- Arrow Sensor -> Jetson -->
        <path d="M 320 102 L 320 138" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />
        <rect x="282" y="112" width="76" height="16" rx="3" fill="#FFFFFF" />
        <text x="320" y="124" text-anchor="middle" font-size="10.5" fill="#2563EB" font-weight="600">topik ROS</text>

        <!-- Node: Jetson -->
        <rect x="130" y="138" width="380" height="46" rx="23" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
        <text x="320" y="157" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">Komputer Onboard (Jetson)</text>
        <text x="320" y="173" text-anchor="middle" font-size="11" fill="#64748B">Perekaman data ke berkas rosbag</text>
      </g>

      <!-- Arrow Jetson -> Step 1 -->
      <path d="M 320 184 L 320 248" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />
      <rect x="270" y="206" width="100" height="18" rx="3" fill="#FFFFFF" />
      <text x="320" y="219" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="600">berkas rosbag</text>

      <!-- ==================== 2. PEMROSESAN DATA (Python) ==================== -->
      <g id="box-python">
        <!-- Container -->
        <rect x="50" y="235" width="540" height="465" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.6" />
        <text x="66" y="256" font-size="12" font-weight="700" fill="#1E3A8A">PEMROSESAN DATA (Python)</text>

        <!-- Step 1 -->
        <rect x="105" y="266" width="430" height="46" rx="23" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
        <text x="320" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">1. Ekstraksi &amp; sinkronisasi rosbag</text>
        <text x="320" y="300" text-anchor="middle" font-size="11" fill="#64748B">+ pembentukan waypoint (ego-frame)</text>

        <!-- Arrow 1 -> 2 -->
        <path d="M 320 312 L 320 338" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />

        <!-- Step 2 -->
        <rect x="155" y="338" width="330" height="42" rx="21" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
        <text x="320" y="364" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">2. Kalibrasi LiDAR–kamera</text>

        <!-- Arrow 2 -> 3 -->
        <path d="M 320 380 L 320 406" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />

        <!-- Step 3 -->
        <rect x="65" y="406" width="510" height="46" rx="23" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
        <text x="320" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">3. Deteksi objek</text>
        <text x="320" y="440" text-anchor="middle" font-size="11" fill="#1D4ED8" font-weight="600">YOLO-seg + sensor fusion (RGB, depth, LiDAR)</text>

        <!-- Arrow 3 -> 4 -->
        <path d="M 320 452 L 320 478" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />

        <!-- Step 4 -->
        <rect x="165" y="478" width="310" height="44" rx="22" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
        <text x="320" y="496" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">4. Segmentasi LiDAR 3D</text>
        <text x="320" y="511" text-anchor="middle" font-size="11" fill="#64748B">(berbasis geometri)</text>

        <!-- Arrow 4 -> 5 -->
        <path d="M 320 522 L 320 548" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />

        <!-- Step 5 -->
        <rect x="100" y="548" width="440" height="46" rx="23" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
        <text x="320" y="567" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">5. Payload BEV</text>
        <text x="320" y="582" text-anchor="middle" font-size="11" fill="#64748B">(titik, objek, waypoint) + geometri jalan</text>

        <!-- Arrow 5 -> 6 -->
        <path d="M 320 594 L 320 620" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />

        <!-- Step 6 -->
        <rect x="180" y="620" width="280" height="44" rx="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
        <text x="320" y="638" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">6. Streaming per frame</text>
        <text x="320" y="653" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="600">(roslibpy)</text>
      </g>

      <!-- Arrow Step 6 -> Rosbridge Server -->
      <path d="M 320 664 L 320 725 L 255 725 L 255 754" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />
      <rect x="238" y="675" width="164" height="28" rx="3" fill="#FFFFFF" />
      <text x="320" y="687" text-anchor="middle" font-size="10.5" fill="#2563EB" font-weight="600">topik /bev/*, /vehicle/*</text>
      <text x="320" y="699" text-anchor="middle" font-size="10" fill="#2563EB">(JSON)</text>

      <!-- Dashed Curved Arrow: Jetson -> Web Video Server -->
      <path d="M 510 161 C 650 185, 680 500, 475 754" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arr-gray)" />
      <rect x="618" y="455" width="72" height="18" rx="3" fill="#FFFFFF" />
      <text x="654" y="468" text-anchor="middle" font-size="10.5" fill="#475569" font-weight="600">topik citra</text>

      <!-- ==================== 3. ROS1 NOETIC ENVIRONMENT ==================== -->
      <g id="box-ros">
        <!-- Container -->
        <rect x="135" y="734" width="465" height="85" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.6" />
        <text x="585" y="752" text-anchor="end" font-size="10.5" font-weight="700" fill="#1E3A8A">ROS1 NOETIC ENVIRONMENT</text>

        <!-- Rosbridge Server -->
        <rect x="150" y="758" width="210" height="46" rx="23" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
        <text x="255" y="777" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Rosbridge Server</text>
        <text x="255" y="792" text-anchor="middle" font-size="10.5" fill="#1D4ED8">(WebSocket, port 9090)</text>

        <!-- Web Video Server (dashed) -->
        <rect x="375" y="758" width="210" height="46" rx="23" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,4" />
        <text x="480" y="777" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Web Video Server</text>
        <text x="480" y="792" text-anchor="middle" font-size="10.5" fill="#475569">(HTTP, port 8080)</text>
      </g>

      <!-- Arrows ROS -> Flutter UI -->
      <!-- Rosbridge -> Flutter (WebSocket) -->
      <path d="M 255 804 L 255 876" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />
      <rect x="220" y="828" width="70" height="16" rx="3" fill="#FFFFFF" />
      <text x="255" y="840" text-anchor="middle" font-size="10.5" fill="#2563EB" font-weight="600">WebSocket</text>

      <!-- Web Video Server -> Flutter (HTTP video stream) -->
      <path d="M 480 804 L 480 876" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-gray)" />
      <rect x="420" y="828" width="120" height="16" rx="3" fill="#FFFFFF" />
      <text x="480" y="840" text-anchor="middle" font-size="10.5" fill="#475569" font-weight="600">HTTP video stream</text>

      <!-- ==================== 4. DASHBOARD APP ==================== -->
      <g id="box-dashboard">
        <!-- Container -->
        <rect x="25" y="852" width="590" height="88" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.6" />
        <text x="40" y="872" font-size="12" font-weight="700" fill="#1E3A8A">DASHBOARD APP</text>

        <!-- Flutter UI -->
        <rect x="40" y="880" width="560" height="46" rx="23" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
        <text x="320" y="899" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">Flutter UI</text>
        <text x="320" y="914" text-anchor="middle" font-size="11" fill="#1E40AF">BEV 3D animasi  ·  BEV point cloud  ·  Peta &amp; navigasi  ·  Grafik</text>
      </g>
    </svg>
  </div>
</body>
</html>
