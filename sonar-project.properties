# =============================================================================
# SonarCloud Configuration for MEVI Dashboard
# Mode: Local Analysis → Upload to SonarCloud (tanpa GitHub integration)
# =============================================================================

# Project identification
sonar.projectKey=dashboard-mevi
sonar.projectName=MEVI Dashboard
sonar.projectVersion=2.0.0

# SonarCloud configuration
sonar.host.url=https://sonarcloud.io
sonar.organization=davinfs15

# Authentication token (generate from SonarCloud: My Account > Security)
# IMPORTANT: Jangan commit token ke Git! Gunakan environment variable:
# export SONAR_TOKEN=your_token_here
# sonar.token=${env.SONAR_TOKEN}

# Source configuration
sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Dart/Flutter specific
sonar.dart.analyzer.options=analysis_options.yaml

# Coverage (generated by flutter test --coverage)
# For SonarCloud native Dart support (LCOV format):
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Exclusions - ignore generated files and non-essential code
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,**/.dart_tool/**,**/build/**
sonar.test.exclusions=**/test/**

# Quality gate - optional
# sonar.qualitygate.wait=true

