# =============================================================================
# SonarQube Configuration for MEVI Dashboard (Flutter & Python)
# =============================================================================

# Project identification
sonar.projectKey=dashboard-mevi
sonar.projectName=MEVI Dashboard
sonar.projectVersion=2.0.0

# Source & Test configuration
sonar.sources=lib,mock_vehicle_server.py
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Dart/Flutter configuration (Plugin sonar-flutter)
# Mode MANUAL & report.mode LEGACY agar SonarScanner di Docker tidak memanggil binary 'flutter' / 'dart' di dalam container
sonar.dart.analyzer.mode=MANUAL
sonar.dart.analyzer.report.mode=LEGACY
sonar.dart.analyzer.report.path=flutter_analyzer_report.txt
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Exclusions - mengecualikan file generated, platform native wrapper, assets, cache
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,**/.dart_tool/**,**/build/**,**/android/**,**/ios/**,**/linux/**,**/macos/**,**/windows/**,**/web/**,**/*.pyc,**/__pycache__/**,**/assets/**,**/deployment/**,**/*.png,**/*.jpg,**/*.glb,**/*.mtl,**/*.bin,**/*.obj
sonar.test.exclusions=**/test/**
